<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1cf72"/><stop offset="1" stop-color="#b7862a"/></linearGradient>
  <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1cf72"/><stop offset="1" stop-color="#b7862a"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35353d"/><stop offset="1" stop-color="#17171b"/></linearGradient>
</defs><rect width="1024" height="1024" fill="#1e1e23"/><g transform="translate(70 215) scale(0.86)"><g>
  <!-- left leg + crossbar: gold -->
