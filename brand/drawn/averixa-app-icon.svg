    <line x1="700" y1="238" x2="676" y2="462"/><line x1="755" y1="238" x2="749" y2="462"/>
    <line x1="810" y1="238" x2="821" y2="462"/>
  </g>
  <!-- handle -->
  <path d="M912 238 L944 150 H1034" fill="none" stroke="url(#gold)" stroke-width="36" stroke-linejoin="miter"/>
  <!-- base + wheels -->
  <path d="M664 462 L706 560 H872" fill="none" stroke="url(#gold)" stroke-width="34" stroke-linejoin="miter"/>
  <g><circle cx="740" cy="626" r="36" fill="url(#goldv)"/><circle cx="740" cy="626" r="13" fill="#1e1e23"/>
     <circle cx="846" cy="626" r="36" fill="url(#goldv)"/><circle cx="846" cy="626" r="13" fill="#1e1e23"/></g>
</g></g></svg>